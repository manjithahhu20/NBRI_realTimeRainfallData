name: archive-rainfall

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *" # stopgap: 5-min coverage until the cron-job.org trigger is live

concurrency:
  group: archive-rainfall
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and append new readings
        id: fetch
        run: python -I scripts/archive.py --root .

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- data
          if [ -f stations.csv ]; then git add -A -- stations.csv; fi
          if [ -d state ]; then git add -A -- state; fi

          if git diff --cached --quiet; then
            echo "no new data"
            exit 0
          fi

          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ) (+${{ steps.fetch.outputs.rows }} rows)"

          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push failed (attempt $attempt); rebasing on origin"
            git pull --rebase --autostash
          done
          echo "::error::push failed after 3 attempts"
          exit 1
